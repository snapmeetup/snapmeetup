.toast.show{transform:translate(-50%,0)}
@media(max-width:700px){.stage{min-width:700px}body{overflow-x:auto}}

.authOverlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:999}
.authOverlay.show{display:flex}.authBox{width:min(92vw,420px);background:#071522;border:2px solid #ff2585;border-radius:16px;padding:24px;box-shadow:0 0 35px #ff258555}
.authBox h2{margin:0 0 6px;color:#fff}.authBox p{color:#aeb8c5;font-size:13px}.authBox input{width:100%;padding:12px;margin:7px 0;border:1px solid #344455;border-radius:8px;background:#0d1d2d;color:#fff}
.authBox button{padding:11px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.authPrimary{width:100%;background:#ff2585;color:#fff;margin-top:8px}.authSwitch{background:transparent;color:#ff5aa1}.authClose{float:right;background:transparent;color:#fff;font-size:20px}
.authMsg{min-height:20px;font-size:13px;margin-top:9px}.authLogged{position:fixed;right:18px;bottom:18px;background:#071522;border:1px solid #ff2585;padding:10px 14px;border-radius:10px;z-index:80;display:none}

<script>
function msg(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function demo(){msg('Fictional AI demo profile — no real Snapchat account is connected.')}

const SUPABASE_URL='https://zoaknrkiusoyvhzpqktc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Tb3-v9XXh8HxRkiGQwc9tA_fGgihqYS';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let authMode='login';
function openAuth(mode){authMode=mode;document.getElementById('authOverlay').classList.add('show');renderAuth()}
function closeAuth(){document.getElementById('authOverlay').classList.remove('show')}
function toggleAuth(){authMode=authMode==='login'?'register':'login';renderAuth()}
function renderAuth(){
 const reg=authMode==='register';
 document.getElementById('authTitle').textContent=reg?'Create Account':'Login';
 document.getElementById('authHint').textContent=reg?'Register with your email. You must verify your email before signing in.':'Login to your SnapMeetUp account.';
 document.getElementById('authAction').textContent=reg?'Register':'Login';
 document.getElementById('switchText').textContent=reg?'Already have an account?':"Don't have an account?";
 document.getElementById('switchBtn').textContent=reg?'Login':'Register';
 document.getElementById('authMsg').textContent='';
}
function allowedEmail(email){
 const domain=(email.split('@')[1]||'').toLowerCase();
 return ['gmail.com','googlemail.com','yahoo.com','hotmail.com','outlook.com'].includes(domain);
}
async function submitAuth(){
 const email=document.getElementById('authEmail').value.trim();
 const password=document.getElementById('authPassword').value;
 const out=document.getElementById('authMsg');
 if(!allowedEmail(email)){out.textContent='Use Gmail, Yahoo, Hotmail or Outlook email.';return}
 if(password.length<6){out.textContent='Password must be at least 6 characters.';return}
 out.textContent='Please wait...';
 if(authMode==='register'){
   const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://snapmeetup.github.io/snapmeetup/'}});
   if(error){out.textContent=error.message;return}
   out.textContent='Account created. Check your email and click the verification link, then login.';
 }else{
   const {error}=await sb.auth.signInWithPassword({email,password});
   if(error){out.textContent=error.message;return}
   out.textContent='Login successful.';setTimeout(closeAuth,600);refreshUser();
 }
}
async function logoutUser(){await sb.auth.signOut();refreshUser();msg('Logged out.')}
async function refreshUser(){
 const {data}=await sb.auth.getUser();const u=data&&data.user;
 const box=document.getElementById('authLogged');
 if(u){document.getElementById('authUser').textContent=u.email;box.style.display='block'}else box.style.display='none';
}
sb.auth.onAuthStateChange(()=>refreshUser());refreshUser();

document.addEventListener('DOMContentLoaded',()=>{
 const login=document.querySelector('.login');
 const submit=document.querySelector('.submitTop');
 if(login) login.addEventListener('click',e=>{e.preventDefault();openAuth('login')});
 if(submit) submit.addEventListener('click',e=>{e.preventDefault();openAuth('register')});
});


</script>
